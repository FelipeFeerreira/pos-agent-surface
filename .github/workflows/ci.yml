name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pytest "mcp>=2,<3"

      - name: Testes do contrato (CLI read-only)
        run: pytest -q tests/

      - name: Teste de fumaça do servidor MCP
        run: |
          python tests/fixtures.py /tmp/fixture.db
          POS_DB=/tmp/fixture.db python pos-query/test_mcp_smoke.py
